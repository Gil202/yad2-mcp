name: Yad2 Daily Apartment Scraper

on:
  schedule:
    # Runs every day at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    # Allows manual trigger anytime from GitHub UI

jobs:
  scrape-and-ingest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Google Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Install System Dependencies & Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb dbus-x11

      - name: Install Python Scraper Dependencies
        run: |
          cd scraper
          python -m pip install --upgrade pip
          pip install nodriver curl_cffi requests

      - name: Run Stealth Scraper
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
        run: |
          cd scraper
          google-chrome --version
          xvfb-run -a --server-args="-screen 0 1920x1080x24" python -u yad2_nodriver_scraper.py
