name: Yad2 On-Demand Apartment Scraper

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Inventory plus details, or detail backfill only
        type: choice
        options: [full, details]
        default: full
      detail_limit:
        description: Maximum detail pages to refresh (1-500)
        type: string
        default: '300'

permissions:
  contents: read

concurrency:
  group: yad2-scrape
  cancel-in-progress: false

jobs:
  scrape-and-ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Google Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Install System Dependencies & Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb dbus-x11

      - name: Install Python Scraper Dependencies
        run: |
          cd scraper
          python -m pip install --upgrade pip
          pip install nodriver curl_cffi requests

      - name: Test ingestion transport and search configuration
        run: python -m unittest discover -s scraper -p 'test_monitor_*.py'

      - name: Run Stealth Scraper
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          YAD2_SEARCHES: ${{ vars.YAD2_SEARCHES }}
          DETAIL_ONLY: ${{ inputs.mode == 'details' && 'true' || 'false' }}
          DETAIL_LIMIT: ${{ inputs.detail_limit || '300' }}
        run: |
          cd scraper
          google-chrome --version
          xvfb-run -a --server-args="-screen 0 1920x1080x24" python -u yad2_nodriver_scraper.py
